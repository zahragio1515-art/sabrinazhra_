<html>
    <head>
        <title>LKPD 3-Tabel</title>
    </head>
    <body>
        <h2>Tabel piket X ACP</h2>
        <table border="1">
     <tr>
                <th rowspan="2">Hari</th>
                <th colspan="2">Tugas piket</th>
                <th></th>
            </tr>
            <tr> <!--baris kedua-->
            <th>menyapu</th>
                <th>menghapus papan</th>
            </tr>
            <tr> <!--baris ketiga-->
                <th>senin</th>
                <th>disca</th>
                <th>hima</th>
            </tr>
            <tr> <!--baris keempat-->
                <th>selasa</th>
                <th>jeni</th>
                <th>zahwa</th>
            </tr>
            <tr> <!--baris kelima-->
                <th>rabu</th>
                <th>zahra</th>
                <th>intana</th>
            </tr>
            <tr> <!--baris keenam-->
                <th>kamis</th>
                <th>risma</th>
                <th>putri</th>
            </tr>
            <tr> <!--baris ketujuh-->
                <th>jumat</th>
                <th>naila</th>
                <th>desi</th>
        </table>
    </body>
</html>
